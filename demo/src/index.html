<script id="boot">
"use strict";
/* =====================================================================
   协作有据 · 演示渲染器
   画面是时间 t（秒）的纯函数：window.__setTime(t)
   无真实时钟 / 无未播种随机数 / 无帧回调驱动
   ===================================================================== */
(function(){

var $ = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var ramp = function(t,a,b){ return b<=a ? (t>=b?1:0) : clamp((t-a)/(b-a),0,1); };

function bezier(x1,y1,x2,y2){
  var cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx;
  var cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
  var fx=function(u){ return ((ax*u+bx)*u+cx)*u; };
  var fy=function(u){ return ((ay*u+by)*u+cy)*u; };
  return function(x){
    if(x<=0) return 0;
    if(x>=1) return 1;
    var u=x;
    for(var i=0;i<10;i++){
      var xv=fx(u)-x, d=(3*ax*u+2*bx)*u+cx;
      if(Math.abs(xv)<1e-6 || d===0) break;
      u-=xv/d;
    }
    u=clamp(u,0,1);
    return fy(u);
  };
}
var EASE = bezier(0.22,1,0.36,1);
var EASE_IO = bezier(0.4,0,0.2,1);

/* 确定性伪随机：整数 hash → [0,1)，用于打字节奏（不用随机数 API） */
function hash01(n){
  n = n|0;
  n = (n ^ 61) ^ (n >>> 16);
  n = (n + Math.imul(n,8))|0;
  n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d);
  n = n ^ (n >>> 15);
  return (n>>>0)/4294967296;
}

/* 二分：返回 flat 中 <= t 的元素个数 */
function upperBound(arr, t){
  var lo=0, hi=arr.length;
  while(lo<hi){ var mid=(lo+hi)>>1; if(arr[mid]<=t) lo=mid+1; else hi=mid; }
  return lo;
}

/* 打字排程：把 lines 的每个字符分配绝对完成时间，总时长严格落在 [t0,t1] */
function buildSchedule(lines, t0, t1, opt){
  opt = opt || {};
  var seed = opt.seed || 1;
  var gaps = opt.gaps || [];
  var midPauses = opt.midPauses || [];
  var pauseTotal = 0, gi;
  for(gi=0; gi<gaps.length; gi++) pauseTotal += (gaps[gi]||0);
  for(gi=0; gi<midPauses.length; gi++) pauseTotal += (midPauses[gi].dur||0);
  var totalTime = Math.max(0.05, (t1-t0) - pauseTotal);

  var weights = [], sum = 0, j, i;
  for(j=0;j<lines.length;j++){
    var line = lines[j], wl = [];
    for(i=0;i<line.length;i++){
      var c = line[i];
      var w = 0.55 + 0.95*hash01(seed + j*1013 + i*7919);
      if('，。；：、'.indexOf(c) >= 0) w *= 2.3;
      else if(c === ' ') w *= 0.8;
      else if('{}()[]=><'.indexOf(c) >= 0) w *= 1.2;
      wl.push(w); sum += w;
    }
    weights.push(wl);
  }
  var scale = totalTime / sum;
  var flat = [], lineStart = [];
  var acc = t0;
  for(j=0;j<lines.length;j++){
    lineStart.push(acc);
    var wl2 = weights[j];
    for(i=0;i<wl2.length;i++){
      acc += wl2[i]*scale;
      for(var p=0;p<midPauses.length;p++){
        if(midPauses[p].line===j && midPauses[p].char===i) acc += midPauses[p].dur;
      }
      flat.push(acc);
    }
    if(j < lines.length-1) acc += (gaps[j]||0);
  }
  return { flat: flat, lineStart: lineStart, total: lines.length, end: acc };
}

/* 打字 DOM：整篇按字生成 span，按 count 切换可见性（布局稳定，不回流） */
function makeTyping(container, lines, opt){
  opt = opt || {};
  var chars = [], lineEls = [], j, i;
  container = container || document.createElement('div');
  for(j=0;j<lines.length;j++){
    var ld, owned = true;
    if(opt.into && opt.into[j]){ ld = opt.into[j]; owned = false; }
    else { ld = document.createElement('div'); ld.className = opt.lineClass || 'tline'; }
    var line = lines[j];
    for(i=0;i<line.length;i++){
      var sp = document.createElement('span');
      sp.textContent = line[i];
      if(opt.charClass){
        var cls = opt.charClass(j,i);
        if(cls) sp.className = cls;
      }
      sp.style.opacity = '0';
      ld.appendChild(sp);
      chars.push(sp);
    }
    lineEls.push(ld);
    if(owned) container.appendChild(ld);
  }
  var caret = document.createElement('span');
  caret.className = 'caret';
  var last = 0, sched = null;
  var api = {
    chars: chars, lineEls: lineEls, caret: caret,
    schedule: null,
    setSchedule: function(s){ sched = s; api.schedule = s; },
    setTime: function(t){
      if(!sched) return 0;
      var n = upperBound(sched.flat, t);
      if(n !== last){
        if(n > last){ for(var k=last;k<n;k++) chars[k].style.opacity='1'; }
        else { for(var k2=n;k2<last;k2++) chars[k2].style.opacity='0'; }
        last = n;
        if(n>0){
          var prev = chars[n-1];
          prev.parentNode.insertBefore(caret, prev.nextSibling);
          caret.style.display='inline-block';
        } else {
          caret.style.display='none';
        }
      }
      return n;
    }
  };
  return api;
}

}

function tokenizeCodeLine(line){
  var toks=[], i=0;
  while(i<line.length){
    var ch=line[i];
    if(ch==='/' && line[i+1]==='/'){ toks.push([i,line.length,'c-com']); break; }
    if(ch==='"' || ch==="'"){
      var j=i+1;
      while(j<line.length && line[j]!==ch){ if(line[j]==='\\') j++; j++; }
      j=Math.min(j+1,line.length);
      toks.push([i,j,'c-str']); i=j; continue;
    }
    if(/[A-Za-z_$]/.test(ch)){
      var k=i;
      while(k<line.length && /[A-Za-z0-9_$]/.test(line[k])) k++;
      toks.push([i,k, KEYWORDS[line.slice(i,k)] ? 'c-kw' : '']);
      i=k; continue;
    }
    i++;
  }
  return toks;
}
function tokenizeJSONLine(line){
  var toks=[], i=0;
  while(i<line.length){
    var ch=line[i];
    if(ch==='"'){
      var j=i+1;
      while(j<line.length && line[j]!=='"') j++;
      j=Math.min(j+1,line.length);
      var k=j; while(k<line.length && line[k]===' ') k++;
      toks.push([i,j, (line[k]===':') ? 'jkey' : 'jstr']);
      i=j; continue;
    }
    if(ch>='0' && ch<='9'){
      var m=i;
      while(m<line.length && ((line[m]>='0'&&line[m]<='9') || line[m]==='.')) m++;
      toks.push([i,m,'jnum']); i=m; continue;
    }
    i++;
  }
  return toks;
}

/* ===================== 主时钟 ===================== */
function setScene(id, on){
  var el = $(id);
  var v = on ? 'visible' : 'hidden';
  if(el.style.visibility !== v) el.style.visibility = v;
}
function shakeX(t){
  var x = 0;
  for(var i=0;i<SHAKE_TIMES.length;i++){
    var d = t - SHAKE_TIMES[i];
    if(d >= 0 && d < 0.40){
      x += 6 * (1 - d/0.40) * Math.sin(d*2*Math.PI/0.10);
    }
  }
  return x;
}
function redFlashP(t){
  var v = 0;
  for(var i=0;i<SHAKE_TIMES.length;i++){
    var d = t - SHAKE_TIMES[i];
    if(d >= 0 && d < 0.45){
      var f = 0.28 * Math.pow(1 - d/0.45, 2.0);
      if(f > v) v = f;
    }
  }
  return v;
}

function setTime(t){
  if(typeof t !== 'number' || !isFinite(t)) t = 0;
  setScene('sc0', t >= 0 && t < 10.0);
  setScene('sc1', t >= 10.0 && t < 40.0);
  setScene('sc2', t >= 40.0 && t < 84.0);
  setScene('sc3', t >= 84.0 && t < 128.0);
  setScene('sc4', t >= 128.0 && t <= 140.0001);

  up0(t); up1(t); up2(t); up3(t); up4(t);

  $('shakeLayer').style.transform = 'translateX(' + shakeX(t).toFixed(3) + 'px)';
  op($('redFlash'), redFlashP(t));
  var okd = t - JSON_FLIP;
  op($('okFlash'), (okd >= 0 && okd < 0.40) ? 0.10*Math.pow(1-okd/0.40, 2) : 0);
}
window.__setTime = setTime;
setTime(0);
})();
</script>
