apiVersion: agent-cord.dev/v1alpha1
kind: Workflow
metadata:
  id: machine-verification-example
  name: 机器验证证据门禁
spec:
  nodes:
    - id: intake
      gates:
        - id: requirement-ready
          role: {}
          attach: { node: intake, when: post }
          checks: [{ ref: file-nonempty, with: { path: prd.md, min_bytes: 20 } }]
          pass: { require: all, human_confirm: false }
          on_fail: block
    - id: verify
      depends_on: [intake]
      gates:
        - id: host-verification
          role: {}
          attach: { node: verify, when: post }
          checks:
            - ref: verification-passed
              with:
                verification_id: unit-tests
                inputs: [src, apps, tests, package.json, package-lock.json, tsconfig.json, vitest.config.ts]
          pass: { require: all, human_confirm: false }
          on_fail: escalate
