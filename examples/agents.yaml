# 按本机已安装的 CLI 选择定义；凭据从环境继承，不写入 YAML。
agents:
  context-coordinator:
    kind: headless
    template: codex
    effort: high
  claude-architect:
    kind: headless
    template: claude
    max_turns: 6
    budget_usd: 2
    agent: architect
    agents_json: >-
      {"architect":{"description":"需求快照协调与架构草稿","prompt":"只依据当前需求快照与证据，提出可验证的方案和下一步。保持草稿，缺失事实显式询问，不批准门禁或合入代码。","tools":["Read","Grep","Glob"],"model":"inherit"}}
  codex-planner:
    kind: headless
    template: codex
    effort: high
  codex-implementer:
    kind: headless
    template: codex
    effort: high
  codex-reviewer:
    kind: headless
    template: codex
    effort: high
  kimi-acp:
    kind: acp
    bin: kimi
    args: [acp]
# ACP worker 可显式声明 permission_policy: {read: [src, tests], edit: [src]}。
# 仅匹配 absolute locations 的 read/edit 请求可一次授权；只读任务仍拒绝。
# 可用 launch: {model: ..., effort: high} 统一配置；Claude 另支持 bare/auto 与角色/预算。
# ACP 可用 launch: {provider: anthropic, model: ..., effort: high, option_ids: {provider: provider, model: llm, effort: thinking}}；ID和值必须来自实际握手。
# ACP model/effort 需要 option_ids，先通过 /agents/:name/inspect 查询当前配置 ID。
# 新 ACP mode 可用 launch: {mode: code, option_ids: {mode: workflow}}，ID/值必须来自实际协议。
# 同ACP别名可声明完整readonly_launch，以plan配置承担只读评审/协调，不合并可写launch：
# dual-worker:
#   kind: acp
#   bin: your-acp-wrapper
#   launch:
#     provider: your-provider-id
#     model: your-writable-model
#     effort: high
#     mode: code
#     option_ids: {provider: provider, model: llm, effort: thinking, mode: workflow}
#   readonly_launch:
#     model: your-review-model
#     effort: low
#     mode: plan
#     option_ids: {model: llm, effort: thinking, mode: workflow}
# 缺省readonly_launch继承原launch；明确只读分支不能声明非plan mode或config_options扩展。
# ACP MCP连接示例（command替换为真实绝对路径；凭据只通过环境变量引用）：
# mcp_servers:
#   - type: stdio
#     name: workspace-tools
#     command: /absolute/path/to/mcp-server
#     args: [--stdio]
#     env_from: {API_KEY: WORKSPACE_MCP_API_KEY}
#   - type: http
#     name: remote-tools
#     url: https://your-mcp-service/mcp
#     headers_from: {Authorization: WORKSPACE_MCP_AUTHORIZATION}
# readonly_mcp_servers: []  # 缺省为空，不继承可写MCP；连接声明不等于只读权限。
# HTTP/SSE须实际握手支持；inspect不连接声明服务，也不检查其凭据。
# 自定义 wrapper 的 args 可绑定 {{prompt}}/{{model}}/{{effort}}/{{readonly}}。
# 原生恢复须给完整 resume_args 并显式绑定 {{resume_session_id}}；无映射则拒绝恢复。
# readonly_args 是完整只读新会话argv，不追加args。
# 声明readonly_args后，只读恢复另需readonly_resume_args；缺失时启动前拒绝。
# 不用独立分支时，可在args/resume_args同时传{{readonly}}，由wrapper处理true/false。
# wrapper 自己负责只读权限和结果输出；需要协议权限请求时优先 ACP。
# custom占位还支持{{bare}}/{{auto}}/{{agent}}/{{agents_json}}/{{system_prompt}}/{{max_turns}}/{{budget_usd}}。
# 所有完整argv分支须保留基本args旋钮集合；bool传true/false，readonly任务auto=false。
# launch中的每个值必须映射；资源参数是底层wrapper额度，不能替代run.goal宿主预算。
# 以下是配置形态示意，需替换成wrapper实际支持的命令后再加入agents：
# custom:
#   kind: headless
#   bin: your-wrapper
#   args: [run, --provider, '{{provider}}', --model, '{{model}}', --effort, '{{effort}}', '{{prompt}}']
#   readonly_args: [review, --provider, '{{provider}}', --model, '{{model}}', --effort, '{{effort}}', '{{prompt}}']
#   resume_args: [resume, '{{resume_session_id}}', --provider, '{{provider}}', --model, '{{model}}', --effort, '{{effort}}', '{{prompt}}']
#   readonly_resume_args: [review-resume, '{{resume_session_id}}', --provider, '{{provider}}', --model, '{{model}}', --effort, '{{effort}}', '{{prompt}}']
#   launch: {provider: your-provider-id, model: your-model-id, effort: high}
